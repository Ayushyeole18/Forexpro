<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forex News - ForexPro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body>

<div id="toastContainer" class="toast-container"></div>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm">
    <div class="container">
        <a class="navbar-brand" href="/">💱 Forex<span>Pro</span></a>
        <div class="collapse navbar-collapse">
            <ul class="navbar-nav me-auto">
                <li class="nav-item">
                    <a class="nav-link" href="/">Home</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/dashboard">Dashboard</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/analytics">Analytics</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link active" href="/news">News</a>
                </li>
            </ul>
            <div class="d-flex gap-2">
                <button class="theme-toggle" onclick="toggleTheme()">
                    <span id="themeIcon">🌙</span>
                </button>
                <a href="/logout" class="btn btn-outline-danger btn-sm">
                    Logout
                </a>
            </div>
        </div>
    </div>
</nav>

<div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold">📰 Forex News & Analysis</h2>
        <button class="btn btn-outline-primary"
                onclick="loadForexNews('all')">
            🔄 Refresh
        </button>
    </div>

    <!-- Filter Buttons -->
    <div class="d-flex flex-wrap gap-2 mb-4">
        <button class="btn btn-primary btn-sm"
                onclick="loadForexNews('all')">All News</button>
        <button class="btn btn-outline-secondary btn-sm"
                onclick="loadForexNews('Central Banks')">
            🏦 Central Banks
        </button>
        <button class="btn btn-outline-secondary btn-sm"
                onclick="loadForexNews('Market Update')">
            📊 Market Update
        </button>
        <button class="btn btn-outline-secondary btn-sm"
                onclick="loadForexNews('USD')">
            🇺🇸 USD
        </button>
        <button class="btn btn-outline-secondary btn-sm"
                onclick="loadForexNews('EUR')">
            🇪🇺 EUR
        </button>
        <button class="btn btn-outline-secondary btn-sm"
                onclick="loadForexNews('GBP')">
            🇬🇧 GBP
        </button>
        <button class="btn btn-outline-secondary btn-sm"
                onclick="loadForexNews('Commodities')">
            🛢️ Commodities
        </button>
    </div>

    <!-- News Grid -->
    <div class="row" id="newsContainer">
        <div class="text-center py-5">
            <div class="spinner mx-auto"></div>
            <p class="mt-2 text-muted">Loading news...</p>
        </div>
    </div>

    <!-- Economic Calendar -->
    <div class="mt-5">
        <h4 class="fw-bold mb-3">📅 Economic Calendar</h4>
        <div class="table-container">
            <div class="table-responsive">
                <table class="table table-hover">
                    <thead>
                    <tr>
                        <th>Date/Time</th>
                        <th>Event</th>
                        <th>Currency</th>
                        <th>Impact</th>
                        <th>Forecast</th>
                        <th>Previous</th>
                    </tr>
                    </thead>
                    <tbody id="calendarContainer">
                    <tr>
                        <td colspan="6" class="text-center">
                            Loading...
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/main.js}"></script>
<script th:src="@{/js/news.js}"></script>
<script>
    loadForexNews('all');
    loadEconomicCalendar();
</script>
</body>
</html>
