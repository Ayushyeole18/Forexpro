<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>History - ForexPro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body>

<div id="toastContainer" class="toast-container"></div>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm">
    <div class="container">
        <a class="navbar-brand" href="/">💱 Forex<span>Pro</span></a>
        <button class="navbar-toggler" type="button"
                data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav me-auto">
                <li class="nav-item">
                    <a class="nav-link" href="/">Home</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/dashboard">Dashboard</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link active" href="/history">History</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/analytics">Analytics</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/news">News</a>
                </li>
            </ul>
            <div class="d-flex gap-2">
                <button class="theme-toggle" onclick="toggleTheme()">
                    <span id="themeIcon">🌙</span>
                </button>
                <a href="/logout" class="btn btn-outline-danger btn-sm">
                    Logout
                </a>
            </div>
        </div>
    </div>
</nav>

<div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold">📋 Conversion History</h2>
        <div class="d-flex gap-2 flex-wrap">
            <button class="btn btn-outline-success btn-sm"
                    onclick="exportHistory('csv')">
                📥 CSV
            </button>
            <button class="btn btn-outline-primary btn-sm"
                    onclick="exportHistory('excel')">
                📊 Excel
            </button>
            <button class="btn btn-outline-danger btn-sm"
                    onclick="exportHistory('pdf')">
                📄 PDF
            </button>
        </div>
    </div>

    <!-- Search and Filter -->
    <div class="row g-3 mb-4">
        <div class="col-md-4">
            <input type="text" id="searchHistory"
                   class="form-control"
                   placeholder="🔍 Search history..."
                   onkeyup="filterHistory()">
        </div>
        <div class="col-md-3">
            <select id="filterCurrency" class="form-select"
                    onchange="filterHistory()">
                <option value="">All Currencies</option>
                <option value="USD">USD</option>
                <option value="EUR">EUR</option>
                <option value="GBP">GBP</option>
                <option value="JPY">JPY</option>
                <option value="INR">INR</option>
            </select>
        </div>
    </div>

    <div class="table-container">
        <div class="table-responsive">
            <table class="table table-striped table-hover"
                   id="historyTable">
                <thead>
                <tr>
                    <th>#</th>
                    <th>From</th>
                    <th>To</th>
                    <th>Amount</th>
                    <th>Converted Amount</th>
                    <th>Exchange Rate</th>
                    <th>Date & Time</th>
                </tr>
                </thead>
                <tbody id="historyTableBody">
                <tr th:if="${#lists.isEmpty(history)}">
                    <td colspan="7"
                        class="text-center text-muted py-4">
                        No conversion history found
                    </td>
                </tr>
                <tr th:each="h,iter : ${history}">
                    <td th:text="${iter.index + 1}"></td>
                    <td>
                        <strong th:text="${h.fromCurrency}">
                        </strong>
                    </td>
                    <td>
                        <strong th:text="${h.toCurrency}">
                        </strong>
                    </td>
                    <td th:text="${h.amount}"></td>
                    <td class="text-success fw-bold"
                        th:text="${h.convertedAmount}"></td>
                    <td th:text="${h.exchangeRate}"></td>
                    <td th:text="${#temporals.format(
                            h.conversionDate,
                            'dd MMM yyyy HH:mm')}">
                    </td>
                </tr>
                </tbody>
            </table>
        </div>

        <!-- Summary Stats -->
        <div class="row g-3 mt-3">
            <div class="col-md-4">
                <div class="stat-card">
                    <div class="stat-label">Total Conversions</div>
                    <div class="stat-value"
                         id="totalConversions">0</div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="stat-card"
                     style="border-left-color:#059669">
                    <div class="stat-label">Most Used Pair</div>
                    <div class="stat-value text-success"
                         id="mostUsedPair" style="font-size:1.2rem">
                        -
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="stat-card"
                     style="border-left-color:#7c3aed">
                    <div class="stat-label">Last Conversion</div>
                    <div class="stat-value"
                         style="color:#7c3aed;font-size:1rem"
                         id="lastConversion">-</div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/main.js}"></script>
<script th:src="@{/js/export.js}"></script>
<script>
    // Filter history table
    function filterHistory() {
        const search = document.getElementById('searchHistory')
            ?.value.toLowerCase() || '';
        const currency = document.getElementById('filterCurrency')
            ?.value.toLowerCase() || '';
        const rows = document.querySelectorAll('#historyTableBody tr');
        let count = 0;

        rows.forEach(row => {
            const text = row.textContent.toLowerCase();
            const matchSearch = text.includes(search);
            const matchCurrency = !currency ||
                text.includes(currency);

            if (matchSearch && matchCurrency) {
                row.style.display = '';
                count++;
            } else {
                row.style.display = 'none';
            }
        });
    }

    // Load summary stats
    function loadStats() {
        const rows = document.querySelectorAll('#historyTableBody tr');
        const total = rows.length;
        document.getElementById('totalConversions').textContent = total;

        if (total > 0) {
            const pairCount = {};
            rows.forEach(row => {
                const cells = row.querySelectorAll('td');
                if (cells.length > 2) {
                    const pair = `${cells[1]?.textContent?.trim()}/${cells[2]?.textContent?.trim()}`;
                    pairCount[pair] = (pairCount[pair] || 0) + 1;
                }
            });

            const mostUsed = Object.entries(pairCount)
                .sort((a, b) => b[1] - a[1])[0];
            if (mostUsed) {
                document.getElementById('mostUsedPair')
                    .textContent = mostUsed[0];
            }

            const lastRow = rows[0];
            if (lastRow) {
                const cells = lastRow.querySelectorAll('td');
                if (cells.length > 6) {
                    document.getElementById('lastConversion')
                        .textContent = cells[6]?.textContent?.trim();
                }
            }
        }
    }

    loadStats();
</script>
</body>
</html>
