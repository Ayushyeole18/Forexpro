# =============================================
# APPLICATION CONFIG
# =============================================
spring.application.name=forexpro
server.port=8081

# =============================================
# DATABASE CONFIG
# =============================================
spring.datasource.url=jdbc:mysql://localhost:3306/forexpro_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# =============================================
# JPA / HIBERNATE CONFIG
# =============================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=true

# =============================================
# THYMELEAF CONFIG
# =============================================
spring.thymeleaf.cache=false
spring.thymeleaf.enabled=true
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# =============================================
# API KEYS
# =============================================
exchangerate.api.key=d78cd1ec47670d35a20e2b11
exchangerate.api.base-url=https://v6.exchangerate-api.com/v6
frankfurter.api.base-url=https://api.frankfurter.app

# =============================================
# LOGGING
# =============================================
logging.level.com.forexpro=DEBUG
logging.level.org.springframework.security=INFO

# =============================================
# FILE UPLOAD
# =============================================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB